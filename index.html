<!DOCTYPE html>

    <!-- Supabase SDK (via CDN) -->

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/client.css">

<body class="dark-theme">
    <!-- Cursor Glow Effect -->
    <div id="cursor-glow"></div>
    
    <!-- Background Particles -->
    <canvas id="particles-canvas"></canvas>

    <!-- Navigation -->
    <nav id="main-nav" class="navbar">
        <div class="nav-brand">
            <a href="#" data-route="home" class="glitch-text" data-text="THE CNPJOTO STREET">THE CNPJOTO STREET</a>
        </div>
        <div class="nav-links">

    <main id="app-content">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title glitch-text" data-text="VISTA A RUA">VISTA A RUA</h1>

                <a href="#catalog" class="btn btn-neon">EXPLORAR COLEÇÃO →</a>

    <script type="module" src="js/app.js?v=8"></script>
